<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- NOMBRE OFICIAL DE LA APLICACIÓN -->
    <title>V-AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA SUPERIOR: IDENTIDAD DE MARCA V-AI Y AJUSTES -->
    <header class="app-top-bar">
        <div class="brand-logo">V<span>-AI</span></div>
        <div class="top-icons">
            <!-- BOTÓN PARA CONFIGURAR O CAMBIAR LA API KEY DE GROQ -->
            <button class="icon-btn" title="Configurar API Key" onclick="configureApiKey()">⚙️</button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL DE CONTENIDO (CONTENEDOR DE PANTALLAS) -->
    <main class="app-screen">

        <!-- PANTALLA 1: INICIO Y EXPLORACIÓN DE PERSONAJES -->
        <section id="view-home" class="screen-view active">
            <!-- BUSCADOR EN TIEMPO REAL -->
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="home-search-input" placeholder="Buscar personajes en V-AI..." onkeyup="filterCharacters()">
            </div>

            <!-- FILTROS POR CATEGORÍA -->
            <div class="category-pills">
                <button class="pill active" onclick="filterCategory('all', this)">Todos</button>
                <button class="pill" onclick="filterCategory('rol', this)">Rol</button>
                <button class="pill" onclick="filterCategory('popular', this)">Populares</button>
                <button class="pill" onclick="filterCategory('anime', this)">Anime</button>
            </div>

            <!-- REJILLA DINÁMICA DE TARJETAS DE PERSONAJES -->
            <div class="feed-grid" id="feed-grid"></div>
        </section>

        <!-- PANTALLA 2: LISTA DE CONVERSACIONES RECIENTES -->
        <section id="view-chats" class="screen-view">
            <h2 class="view-title">Conversaciones Recientes</h2>
            <div class="chat-list" id="recent-chats-list"></div>
        </section>

        <!-- PANTALLA 3: INTERFAZ DE CHAT EN TIEMPO REAL -->
        <section id="view-active-chat" class="screen-view">
            <!-- CABECERA DEL CHAT CON EL BOT ACTIVO -->
            <div class="chat-header">
                <button class="back-btn" onclick="switchNav('view-chats')">←</button>
                <img id="active-avatar" src="" alt="Avatar">
                <div class="chat-header-info">
                    <h3 id="active-name">Bot V-AI</h3>
                    <span class="active-status">● En línea</span>
                </div>
                <!-- BOTÓN PARA BORRAR LA MEMORIA DEL CHAT ACTIVO -->
                <button class="clear-mem-btn" onclick="clearCurrentChatMemory()" title="Reiniciar conversación y borrar memoria">🗑️</button>
            </div>
            
            <!-- CONTENEDOR DONDE SE RENDERIZAN LOS MENSAJES -->
            <div id="messages-container" class="messages-container"></div>
            
            <!-- BARRA INFERIOR DE ENTRADA DE TEXTO -->
            <div class="chat-input-bar">
                <textarea id="user-msg-input" placeholder="Escribe un mensaje para el bot..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button id="send-btn" onclick="sendChatMessage()">➤</button>
            </div>
        </section>

        <!-- PANTALLA 4: PERFIL DE USUARIO Y PERSONAJES CREADOS -->
        <section id="view-profile" class="screen-view">
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <h3>Perfil de Usuario</h3>
                <p class="bio">Creador en V-AI</p>
                <div class="profile-stats">
                    <div><strong id="stat-created">0</strong><span>Creados</span></div>
                    <div><strong id="stat-chats">0</strong><span>Chats</span></div>
                </div>
            </div>
            <h4 class="section-title">Mis Personajes Creados</h4>
            <div class="my-characters-list" id="my-characters-list"></div>
        </section>

    </main>

    <!-- MODAL INFERIOR: OPCIONES DE CREACIÓN -->
    <div id="create-modal" class="modal-overlay" onclick="closeCreateModal(event)">
        <div class="modal-bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-handle"></div>
            <h3>Crear Contenido en V-AI</h3>
            <div class="create-options">
                <div class="option-item" onclick="openCreateForm()">
                    <span class="icon">👤</span>
                    <div>
                        <strong>Crear Personaje</strong>
                        <p>Añade personalidad, historia y comportamiento en rol</p>
                    </div>
                </div>
            </div>
            <button class="btn-cancel" onclick="closeCreateModal()">Cancelar</button>
        </div>
    </div>

    <!-- PANTALLA COMPLETA: FORMULARIO PARA CREAR NUEVO PERSONAJE -->
    <div id="form-create-character" class="modal-overlay">
        <div class="modal-full-screen">
            <div class="form-header">
                <button onclick="closeCreateForm()">✕</button>
                <h3>Nuevo Personaje V-AI</h3>
                <button onclick="saveNewCharacter()" class="btn-save">Guardar</button>
            </div>
            <div class="form-body">
                <!-- CARGA DE IMAGEN/AVATAR -->
                <div class="image-upload-box">
                    <input type="file" id="char-image-file" accept="image/*" hidden onchange="previewImage(event)">
                    <label for="char-image-file" id="image-preview-label">
                        <span>📷</span>
                        <p>Subir Avatar</p>
                    </label>
                </div>
                <!-- CAMPOS DE CONFIGURACIÓN DEL BOT -->
                <input type="text" id="new-name" placeholder="Nombre del personaje" required>
                <textarea id="new-greeting" placeholder="Mensaje de bienvenida / Saludo inicial" rows="2"></textarea>
                <textarea id="new-prompt" placeholder="Instrucciones del sistema (personalidad, contexto, historia y forma de responder)..." rows="6"></textarea>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR DE LA APLICACIÓN -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchNav('view-home', this)">
            <span class="nav-icon">🏠</span>
        </button>
        <button class="nav-item" onclick="switchNav('view-chats', this)">
            <span class="nav-icon">💬</span>
        </button>
        <button class="nav-item create-btn" onclick="openCreateModal()">
            <span class="nav-icon">+</span>
        </button>
        <button class="nav-item" onclick="switchNav('view-profile', this)">
            <span class="nav-icon">👤</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
