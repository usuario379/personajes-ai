<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Clon Character.AI</title>
</head>
<body class="cai-theme">

<div class="main-container">
    <!-- BARRA LATERAL (IDÉNTICA A C.AI) -->
    <nav class="sidebar">
        <div class="logo">Character.AI</div>
        <button class="nav-btn" onclick="showSection('explore')">Explorar</button>
        <button class="nav-btn" onclick="showSection('create')">Crear</button>
    </nav>

    <main id="app-view">
        <!-- FORMULARIO DE CREACIÓN -->
        <section id="create-section" class="content-box">
            <h1>Crear un Personaje</h1>
            
            <div class="avatar-upload">
                <input type="file" id="avatar-input" accept="image/*" hidden>
                <label for="avatar-input" class="avatar-circle">📷</label>
                <p>Subir foto</p>
            </div>

            <div class="input-group">
                <label>Nombre del Personaje</label>
                <input type="text" id="char-name" placeholder="Ej: Tony Stark">
            </div>

            <div class="input-group">
                <label>Saludo Inicial</label>
                <textarea id="char-greeting" placeholder="¿Qué dirá el personaje primero?"></textarea>
            </div>

            <div class="input-group">
                <label>Definición (Prompt largo)</label>
                <textarea id="char-prompt" rows="5" placeholder="Define la personalidad y el contexto aquí..."></textarea>
            </div>

            <div class="input-group">
                <label>Visibilidad</label>
                <select id="char-visibility">
                    <option value="public">Público</option>
                    <option value="private">Privado</option>
                </select>
            </div>

            <button class="btn-create" onclick="saveCharacter()">Crear Personaje</button>
        </section>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
